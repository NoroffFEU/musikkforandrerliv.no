                  "widget": "object",
                  fields: [
                    { label: "Enable Form", name: "enable", "widget": "boolean", "default": true },
                    { label: "Success Message", name: "success_message", "widget": "text", i18n: true }
                  ]
                }
              ]
            }
          - { label: 'Blog', name: 'blog', widget: 'object',
              fields: [
                { label: 'Title', name: 'title', widget: 'string', required: false },
                { label: 'Publish date', name: 'date', widget: 'datetime', required: false },
                { label: 'Author', name: 'author', widget: 'string', required: false },
                { label: 'Excerpt', name: 'excerpt', widget: 'text', required: false },
                { label: 'Content', name: 'content', widget: 'markdown', required: false },
                { label: 'Tags', name: 'tags', widget: 'list', field: { name: 'tag', widget: 'string', required: false }, required: false }
              ] 
