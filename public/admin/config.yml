backend:
  name: github
  repo: NoroffFEU/musikkforandrerliv.no
  branch: develop
  # local_backend: true

  commit_messages:
    create: "Create {{collection}} entry: '{{slug}}'"
    update: "Update {{collection}} entry: '{{slug}}'"
    delete: "Delete {{collection}} entry: '{{slug}}'"
    uploadMedia: "Upload media file: '{{path}}'"
    deleteMedia: "Delete media file: '{{path}}'"

media_folder: 'content/gallery'

i18n:
  structure: single_file
  locales: [en, no, mg]
  default_locale: en

collections:
  - name: 'contents'
    label: 'Contents'
    files: 
      - label: 'English'
        name: 'en'
        file: 'public/locales/locales.en.json'
        required: false,
        fields:
          - { name: 'home', label: 'Home Page', widget: 'object',
              fields: [
                { label: 'Title', name: 'title', widget: 'string', required: false, i18n: true },
                { label: 'Intro', name: 'intro', widget: 'markdown', required: false,  i18n: true },
                { label: 'Hero Image', name: 'hero_image', widget: 'image', required: false,  i18n: true },
                { label: 'Call to Action Text', name: 'cta_text', widget: 'string', required: false,  i18n: true },
                { label: 'Main Content', name: 'main_content', widget: 'markdown', required: false,  i18n: true }
              ] 
            }
          - { name: 'about', label: 'About Us Page', widget: 'object',
              fields: [
                { label: 'Title', name: 'title', widget: 'string', required: false,  i18n: true },
                { label: 'Description', name: 'description', widget: 'text', required: false,  i18n: true },
                { label: 'Sections', name: 'sections', widget: 'list', 
                  field: { 
                    label: 'Section', name: 'section', widget: 'object',
                    fields: [
                      { label: 'Title', name: 'title', widget: 'string', required: false, i18n: true },
                      { label: 'Content', name: 'content', widget: 'markdown', required: false, i18n: true },
                      { label: 'Image', name: 'image', widget: 'image', required: false },
                      { label: 'Image Alt Text', name: 'imageAlt', widget: 'string', required: false, i18n: true }
                    ]
                  }
                },
                { label: 'Contact Form Success Message', name: 'contact_form_success_message', widget: 'string', required: false,  i18n: true },
                { label: 'Contact Form Error Message', name: 'contact_form_error_message', widget: 'string', required: false,  i18n: true },
                { label: 'Contact Info Address', name: 'contact_info_address', widget: 'text', required: false,  i18n: true },
                { label: 'Contact Info Phone', name: 'contact_info_phone', widget: 'number', required: false,  i18n: true }
              ] 
            }
          - { label: 'Our Work Page', name: 'our_work', widget: 'object',
              fields: [
                { label: 'Title', name: 'title', widget: 'string', required: false,  i18n: true },
                { label: 'Date', name: 'date', widget: 'datetime', required: false,  i18n: true },
                { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false,  i18n: true },
                { label: 'Gallery', name: 'gallery', widget: 'list', field: { label: 'Image', name: 'image', widget: 'image', required: false }, i18n: true },
                { label: 'Description', name: 'description', widget: 'markdown', required: false,  i18n: true },
                { label: 'Participants', name: 'participants', widget: 'list', field: { label: 'Name', name: 'name', widget: 'string', required: false }, required: false,  i18n: true },
                { label: 'Results', name: 'results', widget: 'markdown', required: false }
              ] 
            }
          - { label: 'Employees', name: 'employees', widget: 'list', 
              field: { 
                label: 'Employee', name: 'employee', widget: 'object',
                fields: [
                  { label: 'Name', name: 'name', widget: 'string', required: false },
                  { label: 'Role', name: 'role', widget: 'string', required: false },
                  { label: 'Photo', name: 'photo', widget: 'image', required: false },
                  { label: 'Bio', name: 'bio', widget: 'markdown', required: false },
                  { label: 'Job Title', name: 'job_title', widget: 'string', required: false,  i18n: true },
                  { label: 'Charity Role', name: 'charity_role', widget: 'list', field: { label: 'Role', name: 'role', widget: 'string',  i18n: true}, required: false },
                  { label: 'Email', name: 'email', widget: 'string', required: false }
                ] 
              }
            }
          - {
              name: 'news-and-events',
              label: 'News and Events',
              i18n: true,
              widget: 'object',
              fields: [
                { label: 'Title', name: 'title', widget: 'string', required: false, i18n: true },
                { label: 'Publish date', name: 'date', widget: 'datetime', required: false },
                { label: 'Featured Image', name: 'featured_image', widget: 'image' },
                { label: 'Excerpt', name: 'excerpt', widget: 'text', i18n: true },
                { label: 'Content', name: 'content', widget: 'markdown', required: false, i18n: true },
                {
                  label: 'Event Details',
                  name: 'event_details',
                  widget: 'object',
                  fields: [
                    { label: 'Location', name: 'location', widget: 'string', required: false, i18n: true },
                    { label: 'Start Time', name: 'start_time', widget: 'datetime', required: false },
                    { label: 'End Time', name: 'end_time', widget: 'datetime', required: false },
                    { label: 'Organizer', name: 'organizer', widget: 'string', i18n: true }
                  ]
                },
                {
                  label: 'Categories',
                  name: 'categories',
                  widget: 'list',
                  'field': {
                    label: 'Category',
                    name: 'category',
                    widget: 'string',
                    i18n: true
                  }
                }
              ]
            }
          - {
              name: 'support',
              label: 'Support Us',
              i18n: true,
              required: false,
              fields: [
                { label: 'Title', name: 'title', widget: 'string', i18n: true },
                { label: 'Image', name: 'image', widget: 'image' },
                { label: 'Description', name: 'description', widget: 'markdown', i18n: true }
              ]
            }
          - {
              name: "contact",
              label: "Contact Page",
              i18n: true,
              required: false,
              fields: [
                { label: "Title", name: "title", "widget": "string", i18n: true },
                {
                  label: "Description",
                  name: "description",
                  "widget": "object",
                  fields: [
                    { label: "Title", name: "title", "widget": "string", "required": true, i18n: true },
                    { label: "Image", name: "image", "widget": "image", "required": true },
                    { label: "Text", name: "text", "widget": "text", "required": true, i18n: true }
                  ]
                },
                {
                  label: "Contact Details",
                  name: "contact_details",
                  "widget": "list",
                  fields: [
                    { label: "Role", name: "role", "widget": "string", "required": true, i18n: true },
                    { label: "Name", "name": "name", "widget": "string", "required": true, i18n: true },
                    { label: "Email", name: "email", "widget": "string", "required": true },
                    { label: "Phone", name: "phone", "widget": "string" },
                    { label: "Address", name: "address", "widget": "text", i18n: true }
                  ]
                },
                {
                  label: "Social Media",
                  name: "social_media",
                  "widget": "list",
                  fields: [
                    { label: "Platform", name: "platform", "widget": "string", i18n: true },
                    { label: "URL", name: "url", "widget": "string" },
                    { label: "Icon", name: "icon", "widget": "image" }
                  ]
                },
                {
                  label: "Contact Form Settings",
